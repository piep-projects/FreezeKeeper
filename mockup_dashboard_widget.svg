<?xml version="1.0" encoding="UTF-8"?>
<svg width="420" height="220" viewBox="0 0 420 220"
     xmlns="http://www.w3.org/2000/svg"
     font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="115%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10"
                    flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="10" y="10" width="400" height="200" rx="16"
        fill="#1e293b" filter="url(#card-shadow)"/>

  <!-- Card border -->
  <rect x="10" y="10" width="400" height="200" rx="16"
        fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top accent stripe -->
  <clipPath id="card-clip">
    <rect x="10" y="10" width="400" height="200" rx="16"/>
  </clipPath>
  <rect x="10" y="10" width="400" height="5" fill="#0ea5e9"
        clip-path="url(#card-clip)"/>

  <!-- Title -->
  <text x="28" y="46" font-size="17" font-weight="600"
        fill="#f1f5f9" letter-spacing="0.2">🧊 FreezeKeeper</text>

  <!-- Gear icon (settings) — top right, tappable -->
  <g transform="translate(371, 32)" opacity="0.6">
    <!-- outer ring with teeth -->
    <path d="M9,5.5 L9,3 L7,3 L7,5.5
             Q6.2,5.8 5.5,6.4 L3.2,5.2 L1.9,7.0 L4.1,8.3
             Q4.0,8.8 4.0,9 Q4.0,9.2 4.1,9.7 L1.9,11.0 L3.2,12.8 L5.5,11.6
             Q6.2,12.2 7,12.5 L7,15 L9,15 L9,12.5
             Q9.8,12.2 10.5,11.6 L12.8,12.8 L14.1,11.0 L11.9,9.7
             Q12.0,9.2 12.0,9 Q12.0,8.8 11.9,8.3 L14.1,7.0 L12.8,5.2 L10.5,6.4
             Q9.8,5.8 9,5.5 Z"
          fill="#94a3b8"/>
    <!-- inner circle cutout -->
    <circle cx="8" cy="9" r="2.8" fill="#1e293b"/>
  </g>

  <!-- Divider -->
  <line x1="28" y1="60" x2="392" y2="60"
        stroke="#334155" stroke-width="1"/>

  <!-- ── GREEN circle (noch haltbar: 12) ── -->
  <circle cx="65" cy="118" r="42" fill="#22c55e" opacity="0.15"/>
  <circle cx="65" cy="118" r="35" fill="#22c55e"/>
  <text x="65" y="126" font-size="22" font-weight="700"
        fill="#ffffff" text-anchor="middle">12</text>
  <text x="65" y="170" font-size="10" font-weight="500"
        fill="#4ade80" text-anchor="middle">noch haltbar</text>

  <!-- ── ORANGE circle (bald ablaufend: 4) ── -->
  <circle cx="155" cy="118" r="42" fill="#f97316" opacity="0.15"/>
  <circle cx="155" cy="118" r="35" fill="#f97316"/>
  <text x="155" y="126" font-size="22" font-weight="700"
        fill="#ffffff" text-anchor="middle">4</text>
  <text x="155" y="170" font-size="10" font-weight="500"
        fill="#fb923c" text-anchor="middle">bald ablaufend</text>

  <!-- ── RED circle (abgelaufen: 2) ── -->
  <circle cx="245" cy="118" r="42" fill="#ef4444" opacity="0.15"/>
  <circle cx="245" cy="118" r="35" fill="#ef4444"/>
  <text x="245" y="126" font-size="22" font-weight="700"
        fill="#ffffff" text-anchor="middle">2</text>
  <text x="245" y="170" font-size="10" font-weight="500"
        fill="#f87171" text-anchor="middle">abgelaufen</text>

  <!-- ── DARK circle (gesamt: 18) ── -->
  <circle cx="335" cy="118" r="42" fill="#374151" opacity="0.3"/>
  <circle cx="335" cy="118" r="35" fill="#4b5563"/>
  <text x="335" y="126" font-size="22" font-weight="700"
        fill="#ffffff" text-anchor="middle">18</text>
  <text x="335" y="170" font-size="10" font-weight="500"
        fill="#94a3b8" text-anchor="middle">gesamt</text>

  <!-- Tap hint -->
  <text x="210" y="199" font-size="9" fill="#475569"
        text-anchor="middle">Tippen zum Öffnen der gefilterten Übersicht</text>
</svg>

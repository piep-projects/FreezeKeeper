<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3FC1FF"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="flakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E3F2FD"/>
    </linearGradient>
    <linearGradient id="listGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5FBFF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- Snowflake (centered, behind list) -->
  <g transform="translate(256 256)" stroke="url(#flakeGrad)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.95">
    <!-- 6 main arms -->
    <g>
      <line x1="0" y1="-170" x2="0" y2="170"/>
      <line x1="-147" y1="-85" x2="147" y2="85"/>
      <line x1="-147" y1="85" x2="147" y2="-85"/>
    </g>
    <!-- Decorative V-tips on each arm -->
    <g stroke-width="12">
      <!-- top -->
      <polyline points="-26,-144 0,-170 26,-144"/>
      <!-- bottom -->
      <polyline points="-26,144 0,170 26,144"/>
      <!-- upper-right -->
      <polyline points="120,-95 147,-85 137,-58"/>
      <!-- lower-left -->
      <polyline points="-120,95 -147,85 -137,58"/>
      <!-- upper-left -->
      <polyline points="-120,-95 -147,-85 -137,-58"/>
      <!-- lower-right -->
      <polyline points="120,95 147,85 137,58"/>
    </g>
    <!-- Inner mid-branches -->
    <g stroke-width="10" opacity="0.85">
      <line x1="0" y1="-80" x2="-22" y2="-105"/>
      <line x1="0" y1="-80" x2="22" y2="-105"/>
      <line x1="0" y1="80" x2="-22" y2="105"/>
      <line x1="0" y1="80" x2="22" y2="105"/>
      <line x1="-69" y1="-40" x2="-95" y2="-32"/>
      <line x1="-69" y1="-40" x2="-77" y2="-66"/>
      <line x1="69" y1="40" x2="95" y2="32"/>
      <line x1="69" y1="40" x2="77" y2="66"/>
      <line x1="-69" y1="40" x2="-95" y2="32"/>
      <line x1="-69" y1="40" x2="-77" y2="66"/>
      <line x1="69" y1="-40" x2="95" y2="-32"/>
      <line x1="69" y1="-40" x2="77" y2="-66"/>
    </g>
  </g>

  <!-- Checklist clipboard (foreground, slightly offset) -->
  <g filter="url(#softShadow)" transform="translate(180 168)">
    <!-- Clipboard body -->
    <rect x="0" y="20" width="200" height="240" rx="22" ry="22" fill="url(#listGrad)"/>
    <!-- Clip at top -->
    <rect x="64" y="0" width="72" height="44" rx="12" ry="12" fill="#0D47A1"/>
    <rect x="76" y="10" width="48" height="20" rx="6" ry="6" fill="#FFFFFF" opacity="0.85"/>

    <!-- Checklist items -->
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Row 1 -->
      <rect x="24" y="78" width="28" height="28" rx="6" ry="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="4"/>
      <polyline points="30,92 39,101 50,86" stroke="#2E7D32" stroke-width="6" fill="none"/>
      <line x1="68" y1="92" x2="170" y2="92" stroke="#1565C0" stroke-width="6"/>

      <!-- Row 2 -->
      <rect x="24" y="124" width="28" height="28" rx="6" ry="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="4"/>
      <polyline points="30,138 39,147 50,132" stroke="#2E7D32" stroke-width="6" fill="none"/>
      <line x1="68" y1="138" x2="160" y2="138" stroke="#1565C0" stroke-width="6"/>

      <!-- Row 3 (unchecked) -->
      <rect x="24" y="170" width="28" height="28" rx="6" ry="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="4"/>
      <line x1="68" y1="184" x2="174" y2="184" stroke="#90CAF9" stroke-width="6"/>

      <!-- Row 4 (unchecked) -->
      <rect x="24" y="216" width="28" height="28" rx="6" ry="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="4"/>
      <line x1="68" y1="230" x2="150" y2="230" stroke="#90CAF9" stroke-width="6"/>
    </g>
  </g>
</svg>
